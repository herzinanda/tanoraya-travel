<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ic-blue" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#1a32a0"/>
      <stop offset="100%" stop-color="#2468c8"/>
    </linearGradient>
    <linearGradient id="ic-blue-lt" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#4a90d0"/>
      <stop offset="100%" stop-color="#88bce0"/>
    </linearGradient>
    <linearGradient id="ic-orange" x1="0.5" y1="0" x2="0.5" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffe040"/>
      <stop offset="45%"  stop-color="#f7941d"/>
      <stop offset="100%" stop-color="#e84318"/>
    </linearGradient>
  </defs>

  <!--
    Original swoosh viewBox: 0 0 320 115 (≈2.78:1 ratio)
    Fit into 96×34.5 area centered in 100×100:
      scale = 0.3, translate(2, 32.75)
  -->
  <g transform="translate(2, 32.75) scale(0.3)">
    <!-- Light-blue outer arc -->
    <path fill="url(#ic-blue-lt)"
      d="M 255,6 C 295,15 320,52 308,90 C 298,114 268,119 243,104
         C 259,94 271,74 273,53 C 275,31 266,14 255,6 Z"/>

    <!-- Main navy swoosh with interior hole (evenodd) -->
    <path fill="url(#ic-blue)" fill-rule="evenodd"
      d="M 10,104 C 32,90 63,66 97,47 C 131,28 169,13 206,8
         C 233,4 259,8 277,22 C 300,40 306,68 290,90
         C 276,106 252,112 232,102 C 214,92 208,74 214,56
         C 220,38 237,26 255,26 C 234,19 207,17 183,24
         C 150,34 120,55 90,77 C 65,93 36,106 10,104 Z
         M 238,26 C 264,28 278,50 272,74 C 266,95 246,105 226,97
         C 212,88 212,70 220,54 C 228,38 234,24 238,26 Z"/>

    <!-- Orange crescent -->
    <path fill="url(#ic-orange)"
      d="M 252,28 C 272,42 278,66 266,84 C 258,98 242,104 226,96
         C 238,87 246,71 243,53 C 241,40 245,32 252,28 Z"/>
  </g>
</svg>
